# Flow API — self-contained on Render FREE tier (512 MB RAM).
#
# One service, one Dockerfile (./Dockerfile): it installs ONLY
# chromium-headless-shell (~128 MB RSS) and runs flow_server.py with the light
# engine inline. render.yaml is the single source of truth for the deploy.
#
# Free instances have NO persistent disk, so the signed-in Flow session is
# seeded on boot from FLOW_COOKIES_JSON (base64 cookie export, phone-friendly)
# or PROFILE_TAR_URL (a logged-in profile tarball). Free instances sleep after
# 15 min idle — keep them warm with an UptimeRobot HTTP monitor on /health
# (750 free instance-hours/month ≈ one always-on service).
services:
  - type: web
    name: flow-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                    # 512 MB — the headless engine fits
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ROLE
        value: all
      - key: FLOW_ENGINE
        value: headless
      - key: FLOW_PROFILE
        value: /app/profile-copy  # free tier: no disk; seeded each boot
      - key: FLOW_OUT
        value: /app/outputs
      - key: FLOW_MEM_GUARD_MB
        value: "400"              # watchdog: rebuild browser above this RSS
      - key: FLOW_PROJECT
        sync: false               # your Flow project uuid
      - key: FLOW_MODEL
        value: BELUGA             # Nano Banana 2.1
      - key: API_KEYS
        sync: false               # cms1:<long-random-secret>
      - key: FLOW_COOKIES_JSON
        sync: false               # base64 cookie export (phone-friendly)
      - key: FLOW_MASTER_TOKEN
        sync: false               # aas_et/... master token (mints the full jar)
      - key: FLOW_ACCOUNT_EMAIL
        sync: false               # account for the master token
      - key: FLOW_ANDROID_ID
        value: "0123456789abcdef"
      - key: FLOW_KV_URL
        sync: false               # Cloudflare Worker KV endpoint (jar persistence)
      - key: FLOW_KV_SECRET
        sync: false               # auth header for the KV endpoint
      - key: FLOW_EMAIL
        sync: false               # optional: auto sign-in when cookies die
      - key: FLOW_PASSWORD
        sync: false               # (throwaway account only; no 2FA)
      - key: PROFILE_TAR_URL
        sync: false               # OR a logged-in profile tarball URL
      - key: FLOW_PROXY_URL
        sync: false               # optional: residential proxy for the browser
      - key: FLOW_JS_HEAP_MB
        value: "128"              # V8 old-space cap (96 too tight for Angular app)
      - key: FLOW_SINGLE_PROCESS
        value: "0"                # renderer merged: JS spike kills whole browser — keep separate
      - key: RATE_POST_PER_MIN
        value: "20"
      - key: RATE_GET_PER_MIN
        value: "120"
      - key: FLOW_MIN_SUBMIT_INTERVAL
        value: "45"
      - key: FLOW_MAX_GENERATE_PER_DAY
        value: "200"
      - key: FLOW_MAX_UPSCALE_PER_DAY
        value: "100"
