# Flow API — SELF-CONTAINED on Render FREE tier (512 MB RAM).
#
# Runs flow_server.py with the chrome-headless-shell engine inline.
# Measured: 115 MB with flow.google.com loaded, 118 MB peak while minting
# a reCAPTCHA Enterprise token. No home PC worker required.
#
# The heavy "--headless=new" Chrome used by the old Dockerfile.hosted needs
# ~1.2 GB and is why the repo previously concluded "free tier OOMs".
#
# NOTE: Render free instances have NO persistent disk, so a logged-in Flow
# profile cannot be stored across deploys. Seed it with PROFILE_TAR_URL
# (a tarball of a logged-in profile) — see DEPLOY-FREE.md.
services:
  - type: web
    name: flow-api
    runtime: docker
    dockerfilePath: ./Dockerfile.headless
    plan: free                    # 512 MB — the headless engine fits
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ROLE
        value: all
      - key: FLOW_ENGINE
        value: headless
      - key: FLOW_PROFILE
        value: /app/profile-copy  # free tier: no /data disk; seeded from tarball
      - key: FLOW_OUT
        value: /app/outputs
      - key: FLOW_MEM_GUARD_MB
        value: "420"
      - key: FLOW_PROJECT
        sync: false               # your Flow project uuid
      - key: FLOW_MODEL
        value: NARWHAL
      - key: API_KEYS
        sync: false               # cms1:secret1  (content systems send this)
      - key: PROFILE_TAR_URL
        sync: false               # tarball of a logged-in browser profile
      - key: FLOW_COOKIES_JSON
        sync: false               # OR: base64 cookie export (phone-friendly)
      - key: RATE_POST_PER_MIN
        value: "20"
      - key: RATE_GET_PER_MIN
        value: "120"
      - key: FLOW_MIN_SUBMIT_INTERVAL
        value: "45"
      - key: FLOW_MAX_GENERATE_PER_DAY
        value: "200"
      - key: FLOW_MAX_UPSCALE_PER_DAY
        value: "100"
